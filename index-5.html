<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#e4ebdf"><meta name="description" content="One Small Thing — find the good in ordinary life."><title>One Small Thing</title><style>
:root{font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;color:#304838;background:#f6f2e9;font-synthesis:none}*{box-sizing:border-box}body{margin:0;min-height:100vh}.app{max-width:550px;margin:auto;min-height:100dvh;padding:18px 16px 110px}.hero{background:#e5ecdc;border-radius:26px;overflow:hidden}.hero-art{height:142px;position:relative;background:linear-gradient(150deg,#f4dfb0 1%,#e8e7c9 35%,#9ebd9c 100%)}.sun{position:absolute;top:28px;right:82px;width:66px;height:66px;background:#fff3cd;border-radius:50%;filter:blur(1px);box-shadow:0 0 54px #fff4d3}.hill{position:absolute;width:125%;height:100px;border-radius:50% 50% 0 0;left:-12%;bottom:-52px;background:#90af8c}.hill.two{left:23%;bottom:-62px;background:#739979}.hero-copy{padding:19px 21px 24px}.eyebrow{font-size:11px;letter-spacing:1.4px;font-weight:750;text-transform:uppercase;color:#668169}h1{font-family:Georgia,'Times New Roman',serif;font-size:30px;font-weight:500;line-height:1.12;margin:10px 0;color:#2d4936}h2{font-family:Georgia,'Times New Roman',serif;font-size:24px;font-weight:500;margin:0 0 10px}h3{font-size:16px;margin:0 0 8px;font-weight:650}p{line-height:1.57;margin:7px 0;color:#596b5e}.hero p{font-size:14px;margin-bottom:0}.content{padding:23px 2px}.card{padding:20px;background:#fffefa;border-radius:21px;margin:13px 0;box-shadow:0 3px 22px #405c4110}.tint{background:#e6eddf}.quote{font-family:Georgia,'Times New Roman',serif;font-size:23px;line-height:1.33;color:#344f3a;margin:14px 0}.micro{font-size:12px;color:#778579}.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:17px}.btn{border:0;border-radius:13px;padding:12px 16px;background:#456b50;color:#fff;font:600 14px inherit;font-weight:650;cursor:pointer;min-height:43px}.btn:focus-visible,.choice:focus-visible,.nav button:focus-visible{outline:3px solid #bdab75;outline-offset:2px}.btn.outline{background:#eff2e9;color:#3e664a}.btn.ghost{background:transparent;color:#486c50}.btn.full{width:100%}.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:17px 0}.choice{border:1px solid #e3e9df;border-radius:16px;background:#fffefa;padding:16px 8px 13px;color:#49654d;cursor:pointer}.choice span{display:block;font-size:26px;margin-bottom:6px}.choice b{font-size:12px;font-weight:650}.choice.active{background:#dce8d9;border-color:#7b9b7d}.section-title{margin-top:23px}.task-icon{font-size:27px;background:#e6eddf;width:54px;height:54px;border-radius:15px;display:grid;place-items:center;flex-shrink:0}.task-row{display:flex;gap:14px;align-items:flex-start}.task-row h3{margin-top:3px}.nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;padding:9px 12px max(11px,env(safe-area-inset-bottom));background:#fffefaee;backdrop-filter:blur(12px);border-top:1px solid #e8ede4;z-index:5}.nav-inner{max-width:550px;width:100%;display:grid;grid-template-columns:repeat(4,1fr);gap:5px}.nav button{border:0;background:transparent;color:#788b7b;padding:8px 3px;border-radius:13px;font-size:11px;cursor:pointer}.nav button span{display:block;font-size:20px;margin-bottom:4px}.nav button.active{background:#e3ecdf;color:#355d40;font-weight:750}.hidden{display:none!important}textarea{width:100%;border:1px solid #dbe5d9;border-radius:14px;padding:14px;min-height:116px;resize:vertical;font:inherit;color:#334d39;background:#fff}textarea:focus{outline:2px solid #95b69a}.entry{padding:13px 0;border-bottom:1px solid #e9eee7}.entry:last-child{border:0}.entry p{white-space:pre-wrap}.switch-row{display:flex;justify-content:space-between;gap:15px;align-items:center}.switch{accent-color:#456b50;width:20px;height:20px}.tag{display:inline-block;background:#edf2e8;color:#517157;padding:6px 10px;border-radius:30px;font-size:11px;font-weight:700}.toast{position:fixed;bottom:95px;left:50%;transform:translateX(-50%);background:#344f3a;color:#fff;border-radius:30px;padding:11px 19px;box-shadow:0 6px 22px #273a2b33;font-size:13px;z-index:9;white-space:nowrap}.footer{font-size:12px;color:#819082;text-align:center;margin-top:30px}.journal-date{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:#7a8b7d}input[type=time]{padding:8px;border:1px solid #dbe5d9;border-radius:10px;color:#304838;background:white}a{color:#446b4d} @media(min-width:600px){body{background:#ebeee6}.app{background:#f6f2e9;box-shadow:0 0 80px #536c5726}}
</style></head><body><main class="app" id="app"></main><nav class="nav" aria-label="Main navigation"><div class="nav-inner" id="nav"></div></nav><div id="toast" class="toast hidden" role="status"></div><script>
const daily=[
['The ordinary moments are often the ones we wish we could return to.','Notice one today. It doesn’t have to be remarkable.','Give your next cup of tea or coffee your full attention.','☕'],
['A slower moment isn’t a wasted moment.','You don’t have to earn the right to pause.','Take five minutes to sit somewhere comfortable without scrolling.','🌿'],
['Some of the best days are made of very small things.','They don’t always announce themselves.','Look for a tiny detail that makes you smile.','✨'],
['You don’t need a perfect day to find a good moment.','Both things can be true: life can be difficult, and something can still be lovely.','Step outside and notice the air on your face.','🌤️'],
['A friendly word can travel further than you think.','Being kind doesn’t have to be a grand gesture.','Send a quick message to someone you appreciate.','💌'],
['You’re allowed to enjoy something without being good at it.','Not everything needs to become a skill.','Spend ten minutes doing something just because you like it.','🎨'],
['The people we love usually remember the little things.','Attention is a quiet way of showing affection.','Ask someone how their day really went, and listen.','🤍'],
['A day doesn’t have to be productive to matter.','Rest belongs in a good life too.','Leave one non-urgent thing for another day.','🛋️'],
['Look up. The world is still doing beautiful things.','Even when you’re busy, the sky is there.','Spend a minute noticing the clouds, stars or light.','☁️'],
['There is no prize for rushing through your whole life.','A few unhurried minutes can change the feel of a day.','Take the scenic route, even if only for five minutes.','🚶'],
['Some conversations are worth putting your phone down for.','People notice when we’re truly there.','Give someone five minutes of your undivided attention.','💬'],
['Ordinary doesn’t mean unimportant.','Familiar comforts are often quiet treasures.','Notice one thing at home you’re grateful to have.','🏡'],
['You can start again without making a big announcement.','Sometimes a gentle restart is enough.','Tidy one little corner that will make tomorrow easier.','🌱'],
['You’re a person, not a to-do list.','Your worth isn’t measured in boxes ticked.','Do one thing slowly, without trying to optimise it.','🫖'],
['Good things happen between the plans.','Leave some room for the unexpected.','Say yes to a small spontaneous pleasure today.','🍃'],
['There’s a lot to be said for a proper laugh.','It won’t solve everything, but it can lighten a moment.','Share something funny with a friend.','😊'],
['Nature doesn’t ask you to hurry.','Take your cue from the trees for a moment.','Spend ten minutes outdoors if you can.','🌳'],
['It’s okay for today to be enough.','There’s no need to squeeze more from every hour.','End one task and let yourself be finished with it.','🌙'],
['A small kindness counts, including one towards yourself.','You deserve the same patience you give to others.','Speak to yourself as you would to a good friend.','❤️'],
['A familiar song can take you somewhere lovely.','Music has a way of finding old memories.','Play a song that reminds you of a happy time.','🎵'],
['Not everything meaningful can be measured.','Some things just make life feel richer.','Notice something beautiful that serves no practical purpose.','🌼'],
['You can have a hard day and still deserve a nice evening.','Comfort isn’t something you have to earn.','Make yourself something comforting to eat or drink.','🍲'],
['One breath. One moment. That’s enough to begin.','There is no need to fix everything right now.','Relax your shoulders and take three steady breaths.','🌬️'],
['A little bit of sunlight can be a lovely thing.','And so can rain against a window.','Notice what today’s weather feels like, without judging it.','🌦️'],
['There are people who are glad you exist.','Connection can live in ordinary routines.','Check in with somebody, without needing a reason.','📱'],
['You don’t have to fill every silence.','Sometimes quiet is exactly what’s missing.','Let your next short journey happen without any audio.','🍂'],
['It’s worth remembering what made you smile.','The small details add up over time.','Write down one lovely moment before bed.','📝'],
['The best parts of life are rarely on a schedule.','Make a little room for what matters to you.','Spend a few minutes with someone or something you love.','🐾'],
['You’ve already made it through so many ordinary and extraordinary days.','Give yourself some credit for showing up.','Think of one thing you handled with care this week.','🌻'],
['There is good in the ordinary.','You don’t have to go looking very far.','Pick your favourite small moment from the past month.','☀️']];
const moodTasks={good:['It’s lovely when the day feels a little lighter.','Share a little of that good feeling.','Send a message to someone who makes your life better. Nothing elaborate.','💛'],busy:['There’s a lot going on. You don’t have to do it all at once.','Take a proper five-minute break.','Put the phone down. Enjoy your drink. The world can manage without you for five minutes.','☕'],hard:['Some days ask more of us than others.','Give yourself a little breathing space.','Find somewhere comfortable, relax your shoulders and take a few slow breaths. Nothing else is expected.','🌧️']};
const activity=[['Notice the sky','Take a minute to look at the clouds, light or stars.','☁️'],['Reach out','Send someone a message, just because.','💌'],['Slow your next drink','No scrolling. Just enjoy the taste and the pause.','☕'],['Take the scenic route','Give yourself a few extra minutes on your next journey.','🌳'],['Play that song','Put on something you love, and listen all the way through.','🎵'],['Remember something good','Recall a moment from the week that made you smile.','✨'],['A few breaths','Relax your shoulders and take three gentle breaths.','🍃'],['A bit of fresh air','Step outside for a few minutes, if you can.','🌤️']];
const STORE='one-small-thing-prototype-v1';let state;try{state=JSON.parse(localStorage.getItem(STORE))||{}}catch{state={}};state={mood:{},completed:{},favourites:[],journal:{},settings:{reminders:false,time:'08:00'},...state};let page='today';let viewThought=null;const $=id=>document.getElementById(id),today=()=>new Date().toLocaleDateString('en-CA'),prettyDate=s=>new Date(s+'T12:00:00').toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'});const dayOfYear=()=>{let d=new Date();return Math.floor((Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())-Date.UTC(d.getFullYear(),0,1))/86400000)};const dailyId=()=>dayOfYear()%daily.length;function save(){localStorage.setItem(STORE,JSON.stringify(state))}function say(s){$('toast').textContent=s;$('toast').classList.remove('hidden');setTimeout(()=>$('toast').classList.add('hidden'),2300)}function safe(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function top(){return `<header class="hero"><div class="hero-art" aria-hidden="true"><span class="sun"></span><span class="hill"></span><span class="hill two"></span></div><div class="hero-copy"><div class="eyebrow">✳ &nbsp; One Small Thing</div><h1>Find the good<br>in ordinary life.</h1><p>A little room for life, just as it is.</p></div></header>`}function thoughtCard(id){let [q,n]=daily[id];return `<section class="card"><div class="eyebrow">A little thought for today</div><div class="quote">“${safe(q)}”</div><p>${safe(n)}</p><div class="actions"><button class="btn outline" onclick="showThoughts(${id})">Read more thoughts →</button><button class="btn ghost" onclick="fav(${id})" aria-label="${state.favourites.includes(id)?'Remove favourite':'Save favourite'}">${state.favourites.includes(id)?'♥ Saved':'♡ Save'}</button></div></section>`}function render(){let html=top();if(page==='today'){let mood=state.mood[today()]||'busy',m=moodTasks[mood],complete=state.completed[today()];html+=`<section class="content"><div class="eyebrow">Your space for today · ${new Date().toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'})}</div><h2 style="margin-top:9px">Hello, you.</h2><p>Before we get started, how’s life treating you?</p><div class="choices">${[['good','☀️','Quite good'],['busy','🌤️','A bit busy'],['hard','🌧️','It’s tough']].map(([id,e,label])=>`<button class="choice ${mood===id?'active':''}" onclick="setMood('${id}')"><span>${e}</span><b>${label}</b></button>`).join('')}</div>${thoughtCard(dailyId())}<section class="card tint"><div class="eyebrow">Your one small thing</div><p>${safe(m[0])}</p><div class="task-row" style="margin-top:16px"><div class="task-icon">${m[3]}</div><div><h3>${safe(m[1])}</h3><p>${safe(m[2])}</p></div></div><button class="btn full" style="margin-top:20px" onclick="complete()">${complete?'✓ A little moment well spent':'♡ I’ve had my moment'}</button><p class="micro" style="text-align:center">No pressure. It’s here whenever you need it.</p></section><button class="btn outline full" onclick="go('reflect')">Before bed, remember something lovely →</button></section>`}
else if(page==='thoughts'){let id=viewThought??dailyId();html+=`<section class="content"><div class="eyebrow">Words worth keeping</div><h2 style="margin-top:9px">A thought for you</h2><p>Some words are worth returning to.</p><section class="card"><div class="tag">Thought ${id+1} of 30</div><div class="quote">“${safe(daily[id][0])}”</div><p>${safe(daily[id][1])}</p><div class="actions"><button class="btn outline" onclick="viewThought=(${id}+29)%30;render()">← Back</button><button class="btn" onclick="fav(${id})">${state.favourites.includes(id)?'♥ Saved':'♡ Save'}</button><button class="btn outline" onclick="viewThought=(${id}+1)%30;render()">Next →</button></div></section><h3 class="section-title">Your saved thoughts</h3>${state.favourites.length?state.favourites.map(i=>`<section class="card"><p>“${safe(daily[i][0])}”</p><div class="actions"><button class="btn ghost" onclick="viewThought=${i};render()">Read again</button><button class="btn ghost" onclick="fav(${i})">Remove ♡</button></div></section>`).join(''):'<p>Nothing saved yet. Tap the heart on a thought to keep it here.</p>'}</section>`}
else if(page==='moments'){html+=`<section class="content"><div class="eyebrow">Whenever you need it</div><h2 style="margin-top:9px">Something for right now</h2><p>No plans to change your life. Just a little something nice.</p>${activity.map(([title,desc,icon])=>`<section class="card"><div class="task-row"><div class="task-icon">${icon}</div><div><h3>${title}</h3><p>${desc}</p></div></div></section>`).join('')}</section>`}
else if(page==='reflect'){let val=state.journal[today()]||'';let dates=Object.keys(state.journal).sort().reverse();html+=`<section class="content"><div class="eyebrow">The small things matter</div><h2 style="margin-top:9px">Before the day ends...</h2><p>Was there a little moment you’d like to remember? A laugh, a kindness, a quiet cup of coffee?</p><section class="card"><label for="journal"><h3>Something good from today</h3></label><textarea id="journal" placeholder="Write as little or as much as you like...">${safe(val)}</textarea><button class="btn full" style="margin-top:12px" onclick="keepMoment()">Keep this moment ♡</button><p class="micro">For now, these notes stay on this device, in this browser.</p></section><h3 class="section-title">Your remembered moments</h3>${dates.length?dates.map(d=>`<section class="card entry"><div class="journal-date">${prettyDate(d)}</div><p>${safe(state.journal[d])}</p></section>`).join(''):'<p>A little space for the moments you want to hold on to.</p>'}</section>`}
else{let s=state.settings;html+=`<section class="content"><div class="eyebrow">Your little corner</div><h2 style="margin-top:9px">Make it yours</h2><section class="card"><h3>Gentle reminders</h3><p>The app is here for you, not the other way around.</p><div class="switch-row"><label for="remind">Remember my preferred reminder time</label><input type="checkbox" class="switch" id="remind" ${s.reminders?'checked':''} onchange="settingReminder(this.checked)"></div><div class="switch-row" style="margin-top:18px"><label for="remindTime">Morning time</label><input type="time" id="remindTime" value="${s.time}" onchange="setTime(this.value)"></div><p class="micro">This browser prototype remembers your choice but does not send automatic phone notifications. We’ll add real notifications in the Android app.</p></section><section class="card"><h3>A fresh start is always allowed</h3><p>No streaks. No missed-day warnings. No scores for being a human being.</p></section><section class="card"><h3>About One Small Thing</h3><p>A gentle daily companion for finding the good in ordinary life. Not medical or mental-health treatment, and not another task list.</p></section></section>`}html+=`<div class="footer">A little room for life, just as it is. 🌿</div>`;$('app').innerHTML=html;const nav=[['today','☀️','Today'],['moments','🌿','Moments'],['thoughts','♡','Thoughts'],['reflect','📖','Reflect'],['settings','⚙','More']];$('nav').innerHTML=`<div class="nav-inner" style="grid-template-columns:repeat(5,1fr)">${nav.map(([id,ico,label])=>`<button class="${page===id?'active':''}" onclick="go('${id}')"><span>${ico}</span>${label}</button>`).join('')}</div>`}function go(p){page=p;render();window.scrollTo(0,0)}function setMood(m){state.mood[today()]=m;save();render()}function complete(){state.completed[today()]=!state.completed[today()];save();render();say(state.completed[today()]?'That was enough. ♡':'No pressure. Try again whenever.') }function fav(id){if(state.favourites.includes(id))state.favourites=state.favourites.filter(i=>i!==id);else state.favourites.push(id);save();render();say(state.favourites.includes(id)?'Saved for another day ♡':'Removed from favourites')}function showThoughts(i){viewThought=i;go('thoughts')}function keepMoment(){let val=$('journal').value.trim();if(!val){say('Write a little something first ♡');return}state.journal[today()]=val;save();render();say('A moment worth keeping ♡')}function settingReminder(v){state.settings.reminders=v;save();render()}function setTime(v){state.settings.time=v;save();say('Your preferred time has been saved')}render();
</script></body></html>
